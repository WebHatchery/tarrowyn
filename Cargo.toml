[package]
name = "years_of_tarrowyn"
version = "0.1.0"
edition = "2021"

[workspace]
members = ["protocol", "server"]
resolver = "2"

[dependencies]
macroquad = "0.4"
macroquad-toolkit = { path = "../macroquad-toolkit", features = ["net"] }
tarrowyn-protocol = { path = "protocol" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
